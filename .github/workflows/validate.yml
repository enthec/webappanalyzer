name: Validate
on:
  push:
    branches: [ main ]
  pull_request:
    # labeled/unlabeled so adding the 'bulk-change' label re-runs the checks
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          # the pull request validator needs the base branch history
          fetch-depth: 0

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/requirements.txt

      - name: install dependencies
        run: python3 -m pip install -r .github/workflows/requirements.txt

      - name: run structure validator
        id: structure
        run: python3 .github/workflows/scripts/structure_validator.py

      # every validator below runs even if a previous one failed, so a PR gets all errors at once
      - name: run order validator
        if: ${{ !cancelled() && steps.structure.outcome == 'success' }}
        run: python3 .github/workflows/scripts/order_validator.py

      - name: run schema validator
        if: ${{ !cancelled() && steps.structure.outcome == 'success' }}
        run: python3 .github/workflows/scripts/schema_validator.py

      - name: run category validator
        if: ${{ !cancelled() && steps.structure.outcome == 'success' }}
        run: python3 .github/workflows/scripts/category_validator.py

      - name: run group validator
        if: ${{ !cancelled() && steps.structure.outcome == 'success' }}
        run: python3 .github/workflows/scripts/group_validator.py

      - name: run tech validator
        if: ${{ !cancelled() && steps.structure.outcome == 'success' }}
        run: python3 .github/workflows/scripts/technology_validator.py

      - name: run icon validator
        if: ${{ !cancelled() && steps.structure.outcome == 'success' }}
        run: python3 .github/workflows/scripts/icon_path_validator.py

      - name: run pull request validator
        if: ${{ !cancelled() && steps.structure.outcome == 'success' && github.event_name == 'pull_request' }}
        run: python3 .github/workflows/scripts/pr_validator.py
        env:
          BASE_REF: origin/${{ github.base_ref }}
          ALLOW_BULK: ${{ contains(github.event.pull_request.labels.*.name, 'bulk-change') }}
